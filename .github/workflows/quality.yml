name: quality

on:
  push:
    branches: [main, sevan-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    # Windows mirrors the documented development environment and the
    # Windows-style paths in the npm scripts.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/pylock.toml

      - name: Create virtual environment from lock
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r apps\api\pylock.toml
          .venv\Scripts\python.exe -m pip install -e apps\api --no-deps

      - name: Install npm workspace
        run: npm ci

      - name: Repository quality gate
        run: npm run quality

      - name: Sync Worker contract
        run: npm run typecheck:sync

      - name: Account session boundaries
        run: npm run test:sync

      - name: Complete production application
        run: npm run build

      - name: Generated contracts are committed
        run: git diff --exit-code -- schemas apps/web/src/generated

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://prism.sevanlewispayne.com
    concurrency:
      group: prism-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8da821b8147e98cd956351e6b220fe39
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deployment secret'; exit 1; }
          case "$VITE_CLERK_PUBLISHABLE_KEY" in pk_live_*) ;; *) echo 'Missing production Clerk publishable key'; exit 1;; esac
      - name: Build and validate release
        run: npm run build
      - name: Stamp release version
        run: node scripts/stamp_release.mjs
        env:
          PRISM_RELEASE_SHA: ${{ github.sha }}
      - name: Migrate and deploy
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current" = "$GITHUB_SHA" || { echo 'A newer main commit exists; refusing stale deployment'; exit 1; }
          npm run deploy
      - name: Verify deployed release
        run: node scripts/check_hosted_release.mjs
        env:
          PRISM_RELEASE_SHA: ${{ github.sha }}
