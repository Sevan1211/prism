name: quality

on:
  push:
    branches: [main, sevan-dev]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Windows mirrors the documented development environment and the
    # Windows-style paths in the npm scripts.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/pylock.toml

      - name: Create virtual environment from lock
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r apps\api\pylock.toml
          .venv\Scripts\python.exe -m pip install -e apps\api --no-deps

      - name: Install npm workspace
        run: npm ci

      - name: Repository quality gate
        run: npm run quality

      - name: Generated contracts are committed
        run: git diff --exit-code -- schemas apps/web/src/generated
