[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "prism-api"
version = "0.1.0"
description = "Local-first PDF ingestion and semantic-stream API for PRISM"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "pillow>=12.0,<13",
  "pydantic>=2.11,<3",
  "pypdfium2>=5.12,<6",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "reportlab>=4.4,<5",
  "ruff>=0.12,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/prism_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# Repo-local cache: keeps pytest state out of shared per-user locations whose
# ownership sandboxed agent runs have corrupted before.
cache_dir = "../../.pytest-cache"
tmp_path_retention_count = 1

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["prism_api"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
